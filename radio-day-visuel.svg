<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1a4a"/>
      <stop offset="52%" stop-color="#0a1338"/>
      <stop offset="100%" stop-color="#050a24"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="54%" r="54%">
      <stop offset="0" stop-color="#e879f9" stop-opacity=".30"/>
      <stop offset="45%" stop-color="#7c3aed" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#5b8dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="corps" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1740" stop-opacity=".92"/>
      <stop offset="100%" stop-color="#070d2a" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity=".12"/>
    </linearGradient>
    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="f"/>
      <feMerge><feMergeNode in="f"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="doux" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

