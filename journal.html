<li>Artiste masculin de l'année ;</li><li>Chanson de l'année : <i>A World Like This</i> ;</li><li>Fans de l'année ;</li><li>Chanson internationale de l'année : <i>Tempo</i> de Minho (écrite par Omar).</li></ul><p>Ces nominations font suite au remarquable succès de 2025, où Omar avait remporté toutes les catégories dans lesquelles il était nommé.</p><p>Le second tour de vote est désormais ouvert jusqu'au 28 août, avant la cérémonie finale prévue le 16 septembre au parc d'attractions Gröna Lund, à Stockholm.</p><p>Pour nous, cette nouvelle campagne de vote est particulièrement importante.</p><p>À l'approche de la sortie de son deuxième album studio, ces récompenses pourraient renforcer encore la visibilité d'Omar auprès du grand public, des médias et des professionnels de l'industrie musicale.</p><h3>« Siren » : une collaboration qui change de dimension</h3><p>Le 19 juin, Omar a sorti <i>Siren</i>, une collaboration avec le célèbre DJ et producteur allemand Felix Jaehn.</p><p>Connu dans le monde entier pour son remix de <i>Cheerleader</i>, Felix Jaehn est aujourd'hui l'un des producteurs les plus respectés de la scène électronique internationale. Ses titres cumulent des milliards de streams dans le monde, et il collabore régulièrement avec les plus grands artistes de la pop.</p><p>Cette collaboration représente une nouvelle étape importante dans la carrière internationale d'Omar.</p><p>La campagne promotionnelle autour de la sortie était à la hauteur de l'ampleur de la collaboration :</p><ul><li>intégration dans de nombreuses playlists Spotify ;</li><li>campagne publicitaire de grande envergure ;</li><li>forte visibilité sur les principales plateformes de streaming.</li></ul><p>Ce fut l'une des plus grandes campagnes promotionnelles jamais vues pour une sortie d'Omar Rudberg.</p><p>Le clip officiel a été diffusé le jour même, quelques heures seulement après la sortie du single.</p><p>Pendant plusieurs semaines auparavant, les deux artistes avaient teasé cette collaboration sur leurs réseaux sociaux, faisant monter l'impatience des fans.</p><p>Les premiers résultats ont rapidement confirmé le potentiel de la chanson, avec des performances particulièrement encourageantes.</p><h3>Une courte escapade au Portugal avant le retour en studio</h3><p>Après cette période intense, Omar s'est offert quelques jours de repos au Portugal.</p><p>Il a emporté son appareil photo, promettant à ses fans de partager des moments de son voyage.</p><p>Promesse tenue.</p><p>Les photos ont laissé entrevoir un Omar détendu, profitant d'une pause bien méritée avant de reprendre le travail.</p><p>De retour en Suède, il est rapidement retourné en studio pour continuer l'enregistrement des derniers titres de son deuxième album.</p><h3>Les répétitions avant la saison des festivals</h3><p>Juste avant de retrouver son public, Omar et son équipe ont consacré deux journées entières aux répétitions pour les concerts d'été.</p><p>La saison des festivals a officiellement démarré le 27 juin au Rainbow Festival de Cologne.</p><p>Trois autres performances estivales ont également été annoncées en Suède :</p><ul><li>Malmö ;</li><li>Göteborg ;</li><li>Stockholm.</li></ul><p>Une preuve de plus que ce nouveau chapitre marque véritablement le retour d'Omar sur scène.</p><h3>Ibiza avec Nude Project</h3><p>Avant de se lancer dans la saison des festivals, Omar a également participé à plusieurs jours d'événements à Ibiza organisés par Nude Project, la marque de mode espagnole devenue extrêmement populaire auprès du jeune public.</p><p>L'événement réunissait créateurs de contenu, influenceurs, artistes et personnalités de la mode autour de différentes collaborations et activités.</p><p>Cette invitation souligne une nouvelle fois l'intérêt croissant pour Omar au-delà de la musique, notamment dans les univers de la mode, du lifestyle et des partenariats de marque.</p><h3>Une pensée pour le Venezuela</h3><p>Alors qu'il séjournait à Ibiza, Omar a appris la terrible nouvelle des tremblements de terre qui ont frappé le Venezuela.</p><p>Sa mère, qui séjournait dans le pays depuis plusieurs semaines, s'y trouvait au moment de la catastrophe.</p><p>Heureusement, elle est saine et sauve et participe aujourd'hui aux opérations de secours pour aider la population locale.</p><p>La situation a profondément touché Omar, qui reste très attaché à son pays de naissance — un pays que sa mère n'avait pas revu depuis plus de treize ans.</p><p>Nos pensées accompagnent toutes les victimes et leurs familles.</p><h3>Rainbow Festival : un retour triomphal</h3><p>Le 27 juin, Omar est enfin remonté sur scène après plusieurs mois d'absence.</p><p>Des fans venus de nombreux pays différents ont fait le déplacement jusqu'à Cologne pour assister à cette performance tant attendue.</p><p>Dès son entrée sur scène, Omar est apparu plus rayonnant, plus confiant et plus énergique que jamais.</p><p>La première surprise est venue pendant le set de Felix Jaehn, lorsqu'Omar l'a rejoint sur scène pour interpréter <i>Siren</i> en live pour la toute première fois.</p><p>Quelques instants plus tard, pendant sa propre performance, il a offert une autre première en chantant <i>A World Like This</i> en live.</p><p>L'émotion était indéniable : le public lui a renvoyé chaque mot de la chanson, preuve qu'elle avait déjà trouvé une place particulière dans le cœur des fans.</p><p>Puis est venue la plus grande surprise de la soirée.</p><p>Après presque deux ans, Omar a interprété <i>Careless</i>, stupéfiant toute l'assistance. Jusque-là, les fans n'en avaient entendu qu'une courte démo lors des sessions de questions-réponses de sa tournée précédente.</p><p>Le public a reconnu la chanson immédiatement.</p><p>Sur scène, Omar a officiellement annoncé que <i>Careless</i> sortirait le 3 juillet.</p><p>Lors d'un précédent live, il avait laissé entendre qu'il avait « beaucoup de surprises » à venir.</p><p>Cette promesse semble désormais se concrétiser.</p><h3>Le deuxième album se rapproche</h3><p>Même si aucune date de sortie officielle n'a encore été annoncée, une chose est certaine : le deuxième album studio d'Omar Rudberg est entré dans sa dernière ligne droite.</p><p>Entre les nouvelles chansons, les festivals, les collaborations internationales et les nombreuses annonces, tout laisse penser que les mois à venir seront décisifs.</p><p>Lors de son concert à Cologne, Omar a simplement lancé au public :</p><blockquote><p>« On se voit en 2027 ! »</p></blockquote><p>Une phrase qui fait déjà rêver toute la communauté.</p><h3>Le regard de O.R. World Association</h3><p>Ces dernières semaines ont montré une fois de plus à quel point Omar Rudberg continue d'évoluer artistiquement sans jamais perdre ce qui le rend unique : son authenticité.</p><p>Chaque nouveau projet paraît plus personnel, plus ambitieux et plus international que le précédent.</p><p>Notre association continuera d'accompagner ce parcours à travers ses différentes initiatives, en particulier OMAR GLOBAL RADIO DAY.</p><p>L'histoire d'Omar Rudberg continue de s'écrire… et nous sommes plus fiers que jamais d'en faire partie.</p><h3>Ensemble, construisons l'avenir de O.R. World Association</h3><p>L'année 2026 marque le début d'un nouveau chapitre passionnant — non seulement pour Omar Rudberg avec la sortie prochaine de son deuxième album studio, mais aussi pour notre association.</p><p>De nombreuses initiatives sont déjà en préparation : campagnes internationales, jeux concours pour gagner des places de concert, cadeaux pour les fans, futurs projets de fans lors des concerts, événements communautaires et bien d'autres projets que nous avons hâte de partager avec vous.</p><p>Pour donner vie à ces projets, nous avons besoin de votre soutien.</p><p>En devenant membre de O.R. World Association ou en faisant un don, vous contribuez directement à la croissance de notre communauté internationale et vous aidez à financer les initiatives que nous créons pour soutenir le parcours artistique d'Omar Rudberg.</p><p>Chaque contribution, quel qu'en soit le montant, nous aide à :</p><ul><li>organiser des jeux concours et offrir des places de concert ou des cadeaux exclusifs aux fans ;</li><li>continuer à développer notre site et nos outils de communication ;</li><li>préparer des projets de fans pour les concerts ;</li><li>bâtir une association internationale forte, professionnelle et durable.</li></ul><p>Notre ambition est simple : faire de O.R. World Association une communauté de fans internationale reconnue, capable de soutenir les projets d'Omar tout en créant des expériences inoubliables pour les fans du monde entier.</p><p>Mais cette aventure ne peut se construire qu'ensemble.</p><p>Chaque adhésion est un signe de soutien.<br>Chaque don rend un nouveau projet possible.<br>Chaque membre renforce notre mission : aider Omar Rudberg à briller partout dans le monde.</p><h3>Rejoignez-nous dès aujourd'hui !</h3><p>Devenez membre de O.R. World Association et prenez part à cette aventure unique.</p><p>Ensemble, écrivons le prochain chapitre de cette incroyable histoire.</p><p>Parce qu'une communauté unie peut accomplir des choses extraordinaires.</p><p><b>L'équipe O.R. World Association</b></p>", "jo.a7.c": "« A World Like This », quatre nominations aux Rockbjörnen, « Siren » avec Felix Jaehn, le retour sur scène au Rainbow Festival et un deuxième album tout proche.", "jo.a7.t": "Juin 2026 : un mois historique pour Omar Rudberg", "jo.a7.d": "30 juin 2026", "jo.cat.omar": "OMAR", "jo.cat.actualites": "ACTUALITÉS", "jo.cat.bilan": "BILAN MENSUEL", "jo.in.rgpd": "Vos données servent uniquement à l'envoi de ce journal, conformément au RGPD.", "jo.in.ok": "Je m'inscris", "jo.in.mail": "Votre adresse e-mail", "jo.in.p": "Un message par mois, avec les nouveaux articles, les projets en cours et les dates importantes. Pas de publicité, désinscription en un clic.", "jo.in.t": "Recevoir le journal", "jo.pr.env": "Envoyer ma proposition", "jo.pr.ph": "Commencez ici…", "jo.pr.texte": "Votre texte", "jo.pr.rub": "Rubrique", "jo.pr.titre": "Titre", "jo.pr.p": "Une analyse, un récit de concert, un portrait, une actualité : écrivez-nous. Chaque texte est relu avant publication, et signé de votre prénom et de votre pays.", "jo.pr.t": "Proposer un article", "jo.ferme": "Fermer", "jo.f.omar": "OMAR", "jo.f.actu": "ACTUALITÉS", "jo.f.bilan": "BILAN MENSUEL", "jo.f.tout": "Tout", "jo.b3": "7 articles publiés, du plus récent au plus ancien. Cliquez sur un titre pour lire l'article en entier.", "jo.intro": "Les actualités de l'association, les bilans mensuels, les analyses et les histoires qui méritent d'être racontées. Chacun peut proposer un article.", "jo.h1": "Les mots de la communauté", "jo.une": "À LA UNE", "jo.b1": "Tous les articles", "jo.lire": "Lire l'article", "m.titre": "Devenir membre", "m.sous": "Rejoignez la communauté et vivez l'aventure toute l'année, aux côtés de fans du monde entier.", "m.paran": "par an, soit 1 € par mois", "m.annee": "Adhésion valable pour l'année civile en cours.", "m.cta": "Je deviens membre", "m.don": "Faire un don", "m.carte": "MEMBRE", "m.depuis": "MEMBRE DEPUIS", "m.avtitre": "Ce que l'adhésion vous apporte", "m.a1": "Jeux concours", "m.a1t": "Des concours réservés aux membres, sans frais de participation.", "m.a2": "Votes", "m.a2t": "Choisissez les projets que l'association réalisera.", "m.a3": "Ateliers créatifs", "m.a3t": "Créez avec la communauté : design, bracelets, affiches, projets de concert.", "m.a4": "Carte de membre", "m.a4t": "Votre carte numérotée, à votre nom, valable pour l'année.", "m.a5": "Cadeau de bienvenue", "m.a5t": "Un petit objet créé par l'association, envoyé après l'adhésion.", "m.a6": "Éditions réservées", "m.a6t": "Des créations de la boutique proposées uniquement aux membres.", "m.cttitre": "Comment ça se passe", "m.e1": "Créez votre compte", "m.e1t": "Une adresse e-mail et un mot de passe suffisent.", "m.e2": "Réglez les 12 €", "m.e2t": "Par carte bancaire avec Stripe, ou avec PayPal. Paiement sécurisé.", "m.e3": "Recevez votre carte", "m.e3t": "Votre carte numérotée apparaît aussitôt dans votre espace.", "m.e4": "Participez", "m.e4t": "Concours, votes, ateliers, projets : tout s'ouvre à vous.", "m.mintitre": "Vous avez moins de 18 ans ?", "m.mintexte": "Vous êtes les bienvenus. Une autorisation d'un parent ou d'un responsable légal est demandée à l'adhésion, puis pour chaque participation : concours, ateliers, envoi de photos ou d'une histoire. Un parent peut à tout moment demander la suppression des données de son enfant.", "m.faq": "Questions fréquentes", "m.q1": "L'adhésion se renouvelle-t-elle toute seule ?", "m.r1": "Non. Elle couvre l'année civile et vous recevez un rappel avant la fin.", "m.q2": "À quoi servent les 12 € ?", "m.r2": "À financer les projets de la communauté, les créations et les envois. L'association est à but non lucratif.", "m.q3": "Puis-je adhérer depuis l'étranger ?", "m.r3": "Oui, depuis n'importe quel pays. Seuls les frais d'envoi du cadeau varient.", "m.q4": "Comment sont protégées mes données ?", "m.r4": "Elles servent uniquement à la vie de l'association, ne sont jamais vendues, et vous pouvez demander leur suppression à tout moment.", "nav.accueil": "Accueil", "nav.explorer": "OMAR INFOS", "nav.royals": "Young Royals", "nav.communaute": "Communauté", "nav.membres": "Membres", "nav.boutique": "Boutique", "nav.livre": "Livre collaboratif", "nav.journal": "Blog", "nav.association": "Association", "h.l1": "La musique.", "h.l2": "La créativité.", "h.l3": "Les valeurs d'Omar Rudberg.", "h.intro": "Bienvenue à la O.R. World Association, une association de fans qui célèbre son talent, son énergie et son message inspirant. Vous trouverez ici les actualités, les analyses, les projets de la communauté et les liens vers ses plateformes officielles.", "h.mention": "Association indépendante : nous ne représentons pas officiellement Omar ni son équipe. · Site disponible en 6 langues.", "h.btn1": "Entrer dans l'univers →", "h.btn2": "Devenir membre", "h.btn3": "Boutique", "marquee": "BIENVENUE À LA O.R. WORLD ASSOCIATION · LA MUSIQUE · LA COMMUNAUTÉ · LE VOYAGE ·", "c.membres": "MEMBRES", "c.pays": "PAYS", "c.projets": "PROJETS", "c.histoires": "HISTOIRES", "c.concours": "CONCOURS", "c.evenements": "ÉVÉNEMENTS", "c.note": "Ces chiffres se mettent à jour automatiquement. Le nouveau site vient d'ouvrir : tout commence à zéro.", "f.site": "SITE INTERNET", "f.boutique": "BOUTIQUE", "f.autres": "AUTRES", "f.contact": "CONTACT", "f.omar": "OMAR INFOS", "f.shoots": "Presse et shoots", "f.beaute": "OMR Beauty", "f.evenements": "Événements", "f.adhesion": "Adhésion et dons", "f.documents": "Documents officiels", "f.contactlien": "Contact", "f.blog": "Blog", "f.magasin": "Magasin", "f.expedition": "Expédition et retours", "f.conditions": "Conditions générales", "f.politiqueboutique": "Politique de la boutique", "f.paiements": "Paiements", "f.faq": "FAQ", "f.rgpd": "Politique de confidentialité et RGPD", "f.cookies": "Politique de cookies", "f.mentions": "Mentions légales", "f.boutiqueomar": "Boutique officielle d'Omar", "f.mentionlegale": "Association de fans indépendante. Nous ne représentons pas officiellement Omar Rudberg ni son équipe. Les contenus intégrés proviennent des comptes officiels et restent la propriété de leurs auteurs.", "f.heberge": "Site hébergé par GitHub · Base de données Supabase"}, "en": {"jo.a1.x": "<p>Welcome to the blog of O.R. World Association, an independent non-profit association created by fans and for fans of Omar Rudberg.</p><p>On this website, we share our passion, our projects and our admiration for the artist and his inspiring music.</p><h3>Who are we?</h3><p>O.R. World Association is a fan association dedicated to celebrating the music, creativity and values of Omar Rudberg, singer, songwriter, actor and international artistic personality.</p><p>We do not officially represent Omar or his team, but we wish to share our admiration for his talent, his energy and his inspiring message with a worldwide community of fans.</p><h3>Why does this association exist?</h3><p>The association was born from the heart, from a shared love for Omar Rudberg, for his music, his personality and for the emotions he conveys through his art. His voice, his creativity and his closeness with his community have inspired people from all around the world to come together.</p><p>We believe that the fan community can become a model of love, respect and creativity, by spreading positive values and supporting the artist who brings us together.</p><h3>Our mission</h3><p>The main objective of the association is to:</p><ul><li>support and promote Omar Rudberg, his music, artistic projects and performances;</li><li>create a space for discussion and mutual support for fans around the world;</li><li>encourage community projects that bring joy, kindness and solidarity;</li><li>share news, analyses and official links about Omar and his tours;</li><li>bring fans together around concrete projects such as events, creative products and contests;</li><li>enrich our community through initiatives such as a Collaborative Book of fan testimonies.</li></ul><h3>Our values</h3><ul><li>respect for everyone, regardless of their culture or background;</li><li>solidarity between fans through collective initiatives;</li><li>kindness, both towards Omar and within our fanbase.</li></ul><h3>What we do</h3><h4>Community projects</h4><p>We organize participatory projects:</p><ul><li>giveaways with exclusive prizes (concert tickets, official Omar products, etc.);</li><li>a Collaborative Book bringing together stories and testimonies from fans touched by Omar and his artistic universe;</li><li>creative workshops between fans, photo shoots…</li></ul><h4>Supporting fans</h4><p>We also wish to help fans from around the world attend Omar's concerts (transportation, tickets, accommodation) whenever possible.</p><h3>Blog and discussions</h3><p>The association's blog is a space for expression and sharing around Omar, his tours, his music, the series <i>Young Royals</i> (which contributed to his recognition) and everything related to his artistic and human universe.</p><p>There you will find:</p><ul><li>news about our projects and events;</li><li>in-depth articles about our areas of action;</li><li>testimonies and feedback;</li><li>words from volunteers and members;</li><li>stories of lives impacted by the association;</li><li>event announcements;</li><li>calls for volunteers;</li><li>monthly and annual reports;</li><li>new partnerships.</li></ul><h3>Join us</h3><p>O.R. World Association is above all a human adventure.</p><p>Whether you are a member, volunteer, partner or simply curious, you have your place by our side.</p><p>This association is only at its beginning, and everything still remains to be built.</p><p>You can:</p><ul><li>become a member;</li><li>make a donation;</li><li>share the website around you;</li><li>take part in future projects.</li></ul><p>Every support, small or large, helps this collective adventure grow.</p><p>Welcome to the world of O.R. World Association.</p><p><b>The story is only just beginning.</b></p>", "jo.a1.c": "Who we are, why this association exists, what we do and how to join us. The very first article of the blog.", "jo.a1.t": "Welcome to the blog of O.R. World Association", "jo.a1.d": "31 January 2026", "jo.a2.x": "<p>On January 1st, our association dedicated to Omar Rudberg and his fans officially came to life.</p><p>An idea born from a shared passion, from the desire to bring fans together differently, and above all to create something positive, supportive and lasting around Omar's universe.</p><p>One month later, it is already time for a first review, and above all, to say thank you.</p><h3>An encouraging beginning</h3><p>In just 1 month:</p><ul><li>8 members have already joined us;</li><li>€205 have been raised through memberships and donations;</li><li>the association's website has been visited more than 500 times, from nearly 30 countries around the world.</li></ul><p>These numbers may seem modest, but for such a recent launch, they mean a lot to us. Above all, they show one essential thing: the community is here, present, curious and kind.</p><h3>Monthly review &amp; transparency</h3><p>This type of article will mark the beginning of our monthly reports. We want to remain transparent about:</p><ul><li>the funds collected;</li><li>how they are used;</li><li>the evolution of projects.</li></ul><h3>What are donations used for?</h3><p>Donations and memberships are notably used to:</p><ul><li>finance fan projects;</li><li>organize giveaways;</li><li>prepare future association initiatives;</li><li>support the operation of the website and tools.</li></ul><figure class=\"trafic\" data-mois=\"01\" data-a1=\"Map of website visits in January 2026\" data-a2=\"Visits by country in January 2026 (part 1)\" data-a3=\"Visits by country in January 2026 (part 2)\"><figcaption class=\"trafic__t\">Website traffic — January 2026</figcaption><div class=\"trafic__grille\"></div><p class=\"trafic__note\">535 page views · 224 visits · 149 unique visitors · 30 countries — click an image to enlarge it.</p></figure><h3>The merch: in progress</h3><p>We are currently working with a merchandising provider in order to create products designed by and for fans, while respecting Omar's universe.</p><p>The merch is currently being created and received, but you can already pre-order your favorite items (we want to offer environmentally friendly products).</p><h3>Monthly giveaways</h3><p>We also launched a giveaway this month, giving fans the opportunity to win official Omar Rudberg merch.</p><p>However, as Omar's official merch website is temporarily closed, we decided to extend it by one month while hoping Omar returns very soon.</p><p>(We will keep you informed if anything changes.)</p><h3>Waiting for Omar's news</h3><p>Like many fans, we are eagerly waiting for the next announcements regarding Omar Rudberg: an album, a tour, new projects…</p><p>These future announcements will be a true turning point for the association. They will open the door to many initiatives:</p><ul><li>fan projects;</li><li>special giveaways;</li><li>help and support for fans;</li><li>community events and initiatives.</li></ul><p>We are already thinking about what we will be able to put in place when the time comes, so we can be ready to act quickly.</p><p>In order to expand our scope of action and strengthen our possibilities, we are calling for donations and memberships, which will allow us to support the community even more and bring these projects to life.</p><h3>Young Royals on the website</h3><p>To extend the enjoyment and the universe that brings us together, we added several scene summaries from <i>Young Royals</i> (season 1 episode 1) to the website, because <i>Young Royals</i> is more than a series, it is a connection between fans around the world, a series that deeply impacted many people and helped introduce Omar to audiences worldwide.</p><h3>A word from the members</h3><p>Every month, we will publish testimonies from people who wish to share them and send them to us.</p><p>This month it will be Frieda – Netherlands:</p><blockquote><p>“Hello,</p><p>I met Elisabeth (one of the founders of this association) through Instagram in 2025.</p><p>She's a big fan of Omar Rudberg, just like me. In February, she had a giveaway for tickets to a concert in Paris, and I was one of the winners. We love him so much that we both went to more concerts during the ENF TOUR. I met Elisabeth in Paris and have been in regular contact ever since about everything she's doing to raise Omar's profile so he can reach an even wider audience. Omar is a great singer, actor, model, he has created OMR Beauty. Because of the love we and many fans have for him Elisabeth created a website for fans to promote Omar and more, or.world.association. Check it out and sign up as a donor. And if you don't know who Omar Rudberg is go watch <i>Young Royals</i> on Netflix.</p><p>And then watch his concerts on YouTube, you will be amazed.</p><p>We are already great fans and would welcome more fans.”</p></blockquote><p>Valérie – Canada:</p><blockquote><p>“When I first heard about the association, I immediately fell in love with the idea. The project is unifying and unique. We all share one thing in common: our love for Omar. Becoming a member was an opportunity for me to meet wonderful people with whom I could feel comfortable and respected. I discovered this extraordinary artist with a larger-than-life personality at a moment when I deeply needed light in my life. He brought me so much.</p><p>Congratulations to everyone involved in this project!!!”</p></blockquote><p>Because above all, this adventure is human.</p><p>Do not hesitate to send us your testimonies.</p><h3>Join us</h3><p>This association is only at its beginning, and everything still remains to be built.</p><p>You can:</p><ul><li>become a member;</li><li>make a donation;</li><li>share the website around you;</li><li>take part in future projects.</li></ul><p>Every support, small or large, helps this collective adventure grow.</p><p>Thank you to everyone who is already supporting us.</p><p><b>The story is only just beginning.</b></p>", "jo.a2.c": "8 members, €205 raised, more than 500 visits from around thirty countries, and the first testimonies from our members.", "jo.a2.t": "First month of existence: already an incredible adventure", "jo.a2.d": "31 January 2026", "jo.a3.x": "<p>Before diving into the latest updates, take a moment to look at this month's numbers: the website view map, the number of countries represented, the new visits, the returning visitors.</p><p>Behind these statistics, there is far more than data. There are people. Stories. Fans connecting from cities sometimes very far away, at different times of the day, with the same desire: to follow, support and share.</p><p>Watching the map fill up with new countries is deeply emotional. It proves that this community goes beyond borders, languages and cultures. It exists because you bring it to life.</p><p>The association's website was visited by 242 fans for 475 visits (so at least 2 times per person) and more than 1,110 pages of the website were viewed, from nearly 37 countries around the world.</p><figure class=\"trafic\" data-mois=\"02\" data-a1=\"Map of website visits in February 2026\" data-a2=\"Visits by country in February 2026 (part 1)\" data-a3=\"Visits by country in February 2026 (part 2)\"><figcaption class=\"trafic__t\">Website traffic — February 2026</figcaption><div class=\"trafic__grille\"></div><p class=\"trafic__note\">1,118 page views · 475 visits · 242 unique visitors · 37 countries — click an image to enlarge it.</p></figure><h3>What's new on the website</h3><h4>Young Royals: scene-by-scene summaries</h4><p>Writing detailed scene-by-scene summaries of <i>Young Royals</i> season 1 episode 1 is now complete. And this is an important milestone.</p><p>Why? Because this project is colossal. The series has 18 episodes, each filled with glances, silences, tension and invisible nuances that are easy to miss on a first watch. We chose not to rush through anything. To take our time. To respect the intensity of every scene.</p><p>It is not simply a summary. It is an immersion.</p><p>We want those who read them to relive the emotions, feel the turning points and understand the subtleties. It requires time, concentration and a lot of heart.</p><p>There is still a huge amount of work ahead, but we are moving forward with determination.</p><h4>New merch designs</h4><p>New designs were added to our shop today to celebrate the arrival of spring.</p><p>Every creation is carefully designed. Wearing these items is not simply buying a product. It is showing a sense of belonging. It is supporting a collective movement and above all carrying the values of our favorite artist.</p><p>We invite you to pre-order the items you like, whether it is one or several.</p><p>Pre-orders are essential: they allow us to anticipate quantities, avoid waste and above all finance future projects.</p><p>Every order is direct support for the fan community.</p><h4>Discussion rooms: a space to reconnect</h4><p>The discussion rooms have been created, but the technical setup still needs to be properly configured and they will therefore launch very soon.</p><p>We wanted to structure these spaces so they would be clear, organized and enjoyable:</p><ul><li>a room dedicated to Omar's news;</li><li>a room entirely focused on <i>Young Royals</i>;</li><li>a room created to build friendships between fans.</li></ul><p>Because the community is not only about commenting on news. It is also built through exchanges, encounters and spontaneous discussions.</p><p>Here, the rule will remain simple: respect, kindness and listening.</p><h4>Giveaways: a thoughtful postponement… and a new surprise</h4><p>We made the decision to cancel the January giveaway that was supposed to allow fans to win official Omar merch.</p><p>This decision was not made lightly.</p><p>Omar is currently staying discreet, focused on preparing his new album and future tour. His official store is closed for now. We prefer to postpone this giveaway until his return, when he will be fully present and his new artistic era begins.</p><p>We want this future giveaway to truly match that moment.</p><p>But we did not want to leave without offering anything.</p><p>To celebrate the arrival of spring, we are launching a new giveaway in March.</p><p>Prize: an exclusive limited edition keychain, not even available on the website yet.</p><p>A small object, yes. But a symbolic one.</p><h4>Shipments in progress</h4><p>The small booklets reserved for the first 10 members will be shipped this month.</p><p>These first memberships marked the concrete beginning of this adventure. We will not forget that.</p><h3>Preparing for Omar's return: now, not later</h3><p>Even if he is discreet publicly, Omar is actively working on his new album and his tour.</p><p>And we must work too.</p><p>An essential part of an album release process is the pre-save. When Omar gives the signal, we must be ready.</p><h4>What is the purpose of a pre-save?</h4><p>The stakes of an album pre-save: far more than a simple click.</p><p>In the streaming era, an album release no longer begins the day it goes online. It begins long before. The pre-save has become a major strategic tool in an artist's career. Behind this simple action, saving an album before release, there are powerful digital, media… and even live-performance stakes.</p><h4>Creating a strong launch from the very first minute</h4><p>On release day, pre-saved albums automatically appear in fans' libraries.</p><p>Result:</p><ul><li>an immediate spike in streams;</li><li>a concentration of listens during the first hours;</li><li>a more impactful launch.</li></ul><p>The first 24 to 72 hours are crucial. Platforms analyze this data to decide whether the album will be highlighted in recommendations or editorial playlists.</p><p>A high number of pre-saves means: there is real anticipation around this project.</p><h4>Sending a strong signal to algorithms</h4><p>Streaming platforms work based on performance and engagement.</p><p>An album generating:</p><ul><li>fast streams;</li><li>playlist additions;</li><li>shares;</li><li>saves;</li></ul><p>has a greater chance of being recommended to a wider audience.</p><p>The pre-save helps optimize this strategic beginning. It acts as an invisible but powerful lever within the mechanics of algorithms.</p><h4>Measuring fanbase mobilization</h4><p>The pre-save is a concrete indicator.</p><p>We don't think about it enough, but pre-saves can have an indirect impact on concerts.</p><p>An album that starts strong can:</p><ul><li>attract media attention;</li><li>strengthen credibility with producers and event organizers;</li><li>make negotiations easier for tour dates or larger venues.</li></ul><p>Today, streaming numbers are closely analyzed by tour managers. They give insight into the real demand from the audience.</p><p>A successful launch can:</p><ul><li>speed up the announcement of a tour;</li><li>increase venue capacities;</li><li>boost ticket sales.</li></ul><p>The more visible the album is, the more interest grows in seeing the artist live. Streaming fuels the stage, and the stage fuels streaming. The two are deeply connected.</p><h4>Structuring a collective dynamic</h4><p>Pre-saves give the community a clear goal: “We mobilize before the release.”</p><p>It creates:</p><ul><li>a sense of unity;</li><li>a shared action;</li><li>a collective energy.</li></ul><p>Fans become part of the success. They don't simply consume the music, they actively participate in its launch.</p><h4>Maximizing chart opportunities</h4><p>Charts, certifications, media visibility… A strong start influences the entire ecosystem surrounding an album.</p><p>A good ranking can:</p><ul><li>attract new listeners;</li><li>give legitimacy to the project;</li><li>strengthen the artist's professional image.</li></ul><h4>In summary</h4><p>A pre-save is not just a button.</p><p>It is: a strategic tool for platforms, an indicator of engagement, a lever for media visibility, and an indirect asset for concerts and tours.</p><p>In an ultra-competitive music industry, every action matters. And sometimes, the success of an album, and even a tour, begins long before the very first note.</p><h3>Fan projects: building something bigger</h3><p>We are already thinking about the projects we could organize to support the album release and the tour.</p><p>Among the ideas:</p><ul><li>coordinated streaming actions;</li><li>coordinated messages on release day.</li></ul><p>But we want to go further.</p><p>We would like to organize:</p><ul><li>fan meetups to listen to the album together;</li><li>carpooling support systems for concerts;</li><li>solidarity accommodation solutions;</li><li>giveaways to win concert tickets, merch…</li></ul><p>And much more.</p><p>All of this requires anticipation.</p><p>That's why we are already launching a call for memberships and donations.</p><p>This is not something that should be improvised when the album comes out. We need to be ready. Structured. Organized.</p><p>Every contribution, even a small one, can become part of something bigger.</p><h3>Omar in Amsterdam</h3><h4>When the sun becomes an event</h4><p>In February, Omar spent a few days in Amsterdam. Another sky. Another light.</p><p>No snow. Sunshine. A clear sky.</p><p>And it was immediately visible.</p><p>He shared a short Instagram story: his face turned toward the light, his skin finally warmed again. You could almost physically feel the relief. That simple but essential feeling: feeling the sun on your face, on your skin, feeling real warmth.</p><p>He even sang <i>Where Have You Been</i> by Rihanna. A choice that surely wasn't random.</p><p>That song speaks about waiting, searching, something missing that you hope to find again. And in that story, there was almost a symbolism to it: the sun as something you wait for, search for, and finally rediscover.</p><p>Lately, he has been more discreet. So seeing that bright, simple, sincere appearance felt precious. It was brief, but deeply human. We weren't seeing a polished scene. We were seeing a young man happy to feel the warmth of the sun again.</p><p>And it was beautiful. And we were truly happy to see him again.</p><h4>The Swedish winter</h4><p>In Sweden, winter is not just a season. It's an atmosphere. From November to February, the days become dramatically shorter, especially in the center and north of the country. In Stockholm, in December, the sun rises around 8:30 a.m. and sometimes sets before 3 p.m. Further north, daylight becomes even rarer, approaching near permanent twilight.</p><p>This prolonged darkness shapes everyday life. Mornings seem to begin in the middle of the night, and afternoons feel over almost as soon as they start. The light, when it appears, is soft, low, almost fragile. It wraps landscapes in a bluish veil, creates subtle contrasts, and turns silhouettes into delicate shadows.</p><p>This unique climate also influences the aesthetic of Swedish productions. And this is exactly what can be felt in the series <i>Young Royals</i>.</p><h4>Night in broad daylight</h4><p>In <i>Young Royals</i>, light is never insignificant. It participates in the storytelling, the tension, the intimacy.</p><p>It's not uncommon to see scenes meant to take place in broad daylight immersed in an almost nocturnal darkness. For example, when August is summoned to the palace to meet the queen: it's around 4 p.m., but outside is already plunged into deep night. This Swedish winter reality reinforces the solemnity of the moment, the gravity of the scene, and intensifies the pressure weighing on him.</p><p>On the other hand, some nighttime scenes let unexpected light filter through. In winter, the snow reflects urban lights and gives the sky a diffuse, almost unreal brightness. This subtle luminosity creates a suspended atmosphere, as if time itself hesitates between day and night.</p><h4>Cold light, burning emotions</h4><p>The series constantly plays with this contrast between the cold outside world and intense inner emotions.</p><p>The hallways of Hillerska are often filmed in dim, bluish, almost twilight lighting, even when it is supposed to be afternoon. It creates a feeling of confinement, introspection, and waiting. Winter becomes a mirror of the characters' emotional states: loneliness, confusion, restrained desire.</p><p>And then there are those moments where the light changes everything.</p><p>When Simon and Wilhelm finally choose each other, when they officially embrace their relationship, the scene where they unite for the first time is filmed with a particular softness. The light is delicate, almost milky. It wraps around their faces, highlights their glances, transforms the room into a cocoon outside the world. You can no longer truly tell whether it is night or if dawn is approaching, and it is precisely this blur that makes the scene so powerful. As if Sweden itself were holding its breath with them.</p><p>The light does not expose them. It protects them.</p><h4>Sweden as a silent character</h4><p>In <i>Young Royals</i>, Sweden is not just a setting. It is a presence.</p><p>The snowy landscapes, frozen lakes, and dark forests contribute to this feeling of majestic solitude. The outdoor scenes, often filmed beneath pearl-gray skies or in winter half-light, emphasize the vulnerability of the characters. When Wilhelm walks alone, lost in his thoughts, the visual coldness reinforces his inner isolation.</p><p>Winter light acts as a revelation: it erases the unnecessary and leaves only what matters most — looks, silences, raw emotions.</p><h4>When the night becomes a setting for love</h4><p>What makes the series so striking is its ability to make darkness and tenderness coexist.</p><p>In a country where night falls so early, intimacy takes on another dimension. Artificial light — lamps, candles, dim lighting — becomes a refuge. It sculpts faces, brings bodies closer together, amplifies every breath. In this omnipresent winter, love is not dazzling like a summer sun; it is incandescent, discreet, almost secret.</p><p>And perhaps that is the poetry of <i>Young Royals</i>: this way of transforming climatic constraints into emotional language.</p><h4>An aesthetic born from reality</h4><p>Sweden's short days and long nights are not just a meteorological detail. They deeply influence the way stories are filmed, told, and felt.</p><p>In <i>Young Royals</i>, winter light becomes a metaphor: for a love searching for its place, for a truth struggling to emerge, for a world where one sometimes has to cross darkness to reach clarity.</p><p>The Swedish winter is cold, yes. But within this prolonged darkness are born moments of rare intensity.</p><p>And it is precisely this contrast — between early nightfall and blazing emotions — that gives the series its incomparable visual and romantic strength.</p><h3>Giving fans a voice</h3><p>This blog should not be a one-way space.</p><p>We are going to publish texts written by fans: testimonies, feelings, analyses, memories.</p><p>If you would like to share something, write to us (contact page or Instagram DM).</p><p>Your voice matters.</p><h3>Together</h3><p>Follow us on Instagram. Check the website regularly. Share the posts. Give us your ideas. Suggest projects.</p><p>We do all of this for you, but above all with you.</p><p>A community does not survive only because of the artist it supports. It survives because of the connections it creates.</p><p>Omar's return is getting closer. And when that moment comes, we want to be ready. Together.</p>", "jo.a3.c": "A growing community, a return that is getting closer: the Young Royals summaries, the discussion rooms, what a pre-save is really for, and the light of the Swedish winter.", "jo.a3.t": "February 2026: one more month by your side", "jo.a3.d": "28 February 2026", "jo.a4.x": "<p>The month of March marks an important step in the evolution of the association. Between development, new features and major announcements around Omar Rudberg, everything is accelerating… and this is only the beginning.</p><h3>The numbers of the month</h3><p>This month, the community continues to grow and establish itself internationally:</p><ul><li>number of website visits: 635 for 1,419 pages viewed;</li><li>number of fans: 283;</li><li>number of countries represented: 38.</li></ul><p>Behind these numbers, there is above all one reality: a fanbase that is increasingly present, engaged and ready to mobilize.</p><figure class=\"trafic\" data-mois=\"03\" data-a1=\"Map of website visits in March 2026\" data-a2=\"Visits by country in March 2026 (part 1)\" data-a3=\"Visits by country in March 2026 (part 2)\"><figcaption class=\"trafic__t\">Website traffic — March 2026</figcaption><div class=\"trafic__grille\"></div><p class=\"trafic__note\">1,419 page views · 635 visits · 283 unique visitors · 38 countries — click an image to enlarge it.</p></figure><h3>What's new on the website</h3><h4>The discussion rooms are now open</h4><p>A major new feature this March: the discussion rooms are now open.</p><p>Three spaces have been created to allow member supporters to freely exchange, share their passion and fully experience O.R. World Association.</p><p>The highlight? Each member can communicate in their own language, without barriers.</p><p>It is a true opening to the world, where cultures meet, where fans discover each other and where a real international community comes to life.</p><p>Not a member yet? Now is the time to join us and become part of this unique adventure.</p><h4>Young Royals: the summaries continue</h4><p>The association also continues to offer content around the series <i>Young Royals</i>.</p><p>This month, several scene summaries from episode 2 (season 1) were published, with a sensitive, emotional and faithful approach to the universe of the series.</p><p>Content that allows every moment to be relived… differently.</p><h4>Contest giveaway: adaptation and responsiveness</h4><p>Initially planned for January, then postponed to February before being canceled, the giveaway ultimately took a completely different turn.</p><p>Following OMR's surprise announcement regarding the release of a sweatshirt, we decided to react immediately by launching a last-minute giveaway.</p><p>A short format. Only a few days. Strong mobilization.</p><p>This choice reflects our ability to adapt to current events.</p><p>Congratulations to the winner: @france38000 (France).</p><p>This event reminds us of one essential thing: stay connected. Anything can happen at any time.</p><h4>The shop is expanding</h4><p>The shop continues to evolve.</p><p>We have received all of the keychains and mugs, and a new step is already being prepared…</p><p>A photoshoot will take place in April in Paris, with Peggy, professional photographer and member of the association's management team.</p><p>The new items will be put online immediately afterwards.</p><p>The goal: to offer strong, authentic visuals in line with the identity of the association.</p><h3>A major announcement: Omar's album</h3><p>The month of March will remain marked as a suspended moment, almost silent… but filled with meaning.</p><p>Omar spoke on his VIP TikTok group, and through a few simple words, he hinted that something was coming. He mentioned a recent meeting with his team, an excitement difficult to contain… a new energy entirely focused on his music.</p><p>If he has been more discreet lately, it is not by chance. He felt the need to step away, to take a step back, to reconnect with himself, away from the noise, away from expectations, in order to reconnect with what truly matters. To isolate himself, create, feel, build…</p><p>And at the center of all this, one certainty: his album is in progress.</p><h3>Preparing: an obvious necessity</h3><p>This announcement is not insignificant. It changes everything.</p><p>An album is not simply a music release that people listen to and then share. It is a life moment, a key step in an artist's journey, an imprint they leave behind, a story they choose to tell the world.</p><p>At O.R. World Association, we made a strong decision: not to wait for everything to happen.</p><p>We want to be ready even before the first official announcement, ready to welcome this moment as it deserves, with respect, strength and unity.</p><p>That is why we are putting in place a real action plan: structuring our communication, gathering fans, coordinating energies, organizing shares, preparing streaming efforts, amplifying visibility from the very first hours.</p><p>Our goal is simple, but essential: to be present, to be united, to be effective.</p><p>Because when a fanbase is organized, aware of its impact and driven by a common intention… it becomes a true force.</p><h3>A call to all fans</h3><p>Today, more than ever, we need you.</p><p>We need this collective energy, this passion that connects us, this shared desire to support, to help grow and carry even further what Omar is creating.</p><p>Talk about it around you. Share, even without an official announcement. Bring other fans together, spread this anticipation, this emotion, this feeling that something important is approaching.</p><p>Because the truth is, everything starts now.</p><p>Long before the album release, long before the first notes, long before the first visuals… it is today that the impact of tomorrow is being built.</p><p>And after the album… there will most certainly be a tour.</p><p>New moments to experience, meetings, stages, memories.</p><p>So yes, it is essential to be ready. Ready to be present. Ready to commit. Ready to stand together. Because this moment will not only be his. It will also be ours.</p><h3>A strengthened social media strategy</h3><p>In order to amplify our impact, a collaboration will be set up between the association's Instagram account and omarrudberg-world (the president's account).</p><p>Why?</p><ul><li>reach a wider audience;</li><li>connect communities;</li><li>increase visibility;</li><li>strengthen the global impact.</li></ul><p>This is an essential strategy to support the upcoming announcements.</p><h3>TikTok arrives in April</h3><p>Another major new feature: the launch of a TikTok page in April.</p><p>A new channel to:</p><ul><li>reach even more fans;</li><li>create dynamic content;</li><li>follow trends;</li><li>amplify Omar's visibility.</li></ul><h3>Conclusion</h3><p>March is not just another month. It is a turning point.</p><p>The community is growing. The tools are being put in place. And above all… something is coming.</p><p>The album is approaching, the tour will follow.</p><p>And this time, we will be ready.</p><p><b>TOGETHER.</b></p>", "jo.a4.c": "The opening of the discussion rooms, a giveaway improvised in a few days, and the announcement we were all waiting for: Omar's album is in progress.", "jo.a4.t": "March 2026: a key month for O.R. World Association", "jo.a4.d": "31 March 2026", "jo.a5.x": "<p>April was an important milestone in the development of the association.</p><p>Between strengthening our actions, launching new projects, and preparing a large-scale initiative, we laid strong foundations for what comes next.</p><h3>This month's numbers: growth that continues to rise</h3><p>This month, the mobilization kept growing. The community remains active, engaged, and more present than ever. Every interaction, every share, and every message helps move our mission forward. The numbers reflect a real collective momentum, driven by a shared passion for Omar.</p><p>This month, the community continues to grow and strengthen internationally:</p><ul><li>number of website visits: 800 for 1,758 pages viewed;</li><li>number of fans: 341;</li><li>number of represented countries: 39.</li></ul><p>Beyond the numbers, these figures reflect real progress in visibility and an increasingly strong international presence.</p><p>The community is becoming more structured, expanding, and growing in engagement.</p><figure class=\"trafic\" data-mois=\"04\" data-a1=\"Map of website visits in April 2026\" data-a2=\"Visits by country in April 2026 (part 1)\" data-a3=\"Visits by country in April 2026 (part 2)\"><figcaption class=\"trafic__t\">Website traffic — April 2026</figcaption><div class=\"trafic__grille\"></div><p class=\"trafic__note\">1,758 page views · 800 visits · 341 unique visitors · 39 countries — click an image to enlarge it.</p></figure><h3>The association's actions</h3><h4>The website has been translated into English</h4><p>The website was translated into English to make it more accessible to an international audience (even though it could already be translated into all languages through Google Translate). A large part of the work is now complete, although some sections are still being finalized.</p><p>This evolution reflects a clear goal: making our content more accessible and supporting the international growth of the community.</p><h4>A photoshoot for the shop</h4><p>A first photoshoot was carried out for several shop items.</p><p>The visuals are currently being edited and will soon be available online.</p><p>This project marks the arrival of new products, carefully designed to offer content that is more qualitative and closely connected to our universe. We can't wait to show you the result.</p><h4>Young Royals: new summaries have appeared</h4><p>A way to keep alive the universe that brings us all together and revisit the important moments that helped introduce Omar internationally.</p><h3>Launch of the operation OMAR GLOBAL RADIO DAY</h3><p>After several weeks of planning and preparation, the operation “OMAR GLOBAL RADIO DAY” will officially launch on May 1st, 2026 for several weeks.</p><p>The goal is to create a coordinated international action to promote Omar's music on radios around the world.</p><p>This initiative is based on structured organization and collective mobilization, with a strategy designed to maximize its impact. We hope to see as many of you as possible taking part in order to make it work.</p><p>It is also important to note that Omar saw this operation and liked the first 9 posts about it. Even if discreet, this gesture confirms the attention given to this initiative.</p><h3>A message from Omar that deeply touched all of us</h3><p>This month, we also received something very precious.</p><p>Following an “accidental mistake” on his phone, Omar shared with us a short video extract from the recording of one of his new songs. And two days later, he posted a video on his VIP TikTok where he thanked us for being there and supporting him. He told us that he sees everything we do for him.</p><p>He also spoke about the difficulties he went through during the winter, while reassuring us that today, everything is okay.</p><p>A sincere and human moment that reminds us why we do all of this and why we love him so much. And to thank us for being there for him, he shared a demo of that song with us — an absolutely beautiful and emotional ballad carried by an incredible voice. A suspended moment full of emotion that makes us even more excited for what is coming next.</p><h3>A stronger community than ever</h3><p>Between concrete projects, moments of closeness with Omar, and the launch of a worldwide operation, one thing is clear: the community is no longer just a simple support system, it is becoming a real driving force.</p><p>Today, more than ever, your mobilization is essential.</p><p>The coming weeks will be decisive, especially with the launch of the international operation. The success of this initiative will depend on everyone's ability to participate in an organized, regular, and consistent way.</p><p>At a time when Omar Rudberg is preparing a new album, this collective dynamic can play a key role in his international visibility.</p><p>We need this shared energy, this shared passion, and this collective desire to support Omar and help him grow.</p><p>Talk about it around you. Mobilize other fans and spread this anticipation, this excitement, and this belief that something important is coming.</p><p>Because everything starts now.</p><p>Long before the album release, before the first notes or the first visuals, the impact of tomorrow is being built today.</p><p>And after the album, a tour will most likely follow. New opportunities, meetings, stages, and moments to experience together.</p><p>So it is essential to be ready: ready to be present, ready to get involved, ready to act together.</p><p>Because this moment will not only be his. It will also be ours.</p><h3>TikTok arrived in April</h3><p>The launch of a TikTok account in April marks another step in our communication strategy:</p><ul><li>expand the audience;</li><li>create dynamic content;</li><li>strengthen the visibility of our actions.</li></ul><h3>Join and support the association</h3><p>Today, our project around Omar Rudberg continues to grow thanks to an engaged and mobilized community.</p><p>To go further, we need to structure this momentum and give it the means to grow sustainably.</p><h4>Why join?</h4><p>Joining the association means:</p><ul><li>actively supporting our actions;</li><li>being part of an engaged and organized community;</li><li>contributing to concrete international initiatives;</li><li>helping organize future projects during Omar's concerts (fan projects, merch giveaways, etc.).</li></ul><p>Every membership strengthens our credibility and our ability to carry out ambitious projects.</p><h4>Take action</h4><p>If you would like to get more involved and contribute concretely:</p><ul><li>join the association;</li><li>make a donation.</li></ul><p>Every contribution makes a difference.</p><h3>Conclusion</h3><p>With the launch of the international operation OMAR GLOBAL RADIO DAY, our mobilization is reaching a new level.</p><p>The success of this project relies on consistency, involvement, and the collective strength of the fans. By acting together, with coordination and determination, we can truly make a difference.</p><p>As Omar Rudberg's new album approaches, every action helps strengthen his visibility and prepare the impact of future projects.</p><p>This operation is not only about the present. It is also about building something bigger for the future: more visibility, more opportunities, and more moments to experience together through his music.</p><p>Sharing, spreading information, and helping the movement grow is essential. Every participation matters.</p><p>What we are building today can truly have an impact. So let's continue together, with motivation, organization, and commitment.</p><p><b>Let's build what comes next, together.</b></p>", "jo.a5.c": "The launch of the OMAR GLOBAL RADIO DAY operation, the shop photoshoot, the website translated into English and a message from Omar that touched us all.", "jo.a5.t": "April 2026: an intense month between projects and mobilization around Omar Rudberg", "jo.a5.d": "30 April 2026", "jo.a6.x": "<p>The month of May 2026 was filled with emotions, projects, and great progress for our association and for the entire community surrounding Omar Rudberg. Between the preparations for the store, the international fan initiatives, and the announcements surrounding Omar's new album, this month will remain particularly important.</p><h3>This month's figures</h3><p>Thanks to all of you, our community continues to grow every month.</p><p>The figures for May 2026:</p><ul><li>number of website visits: 846 for 1,843 pages viewed;</li><li>number of fans: 358;</li><li>number of represented countries: 42.</li></ul><figure class=\"trafic\" data-mois=\"05\" data-a1=\"Map of website visits in May 2026\" data-a2=\"Visits by country in May 2026 (part 1)\" data-a3=\"Visits by country in May 2026 (part 2)\"><figcaption class=\"trafic__t\">Website traffic — May 2026</figcaption><div class=\"trafic__grille\"></div><p class=\"trafic__note\">1,843 page views · 846 visits · 358 unique visitors · 42 countries — click an image to enlarge it.</p></figure><h3>OMAR GLOBAL RADIO DAY</h3><p>On May 29, Omar Rudberg unveiled his new song “A World Like This”, the first glimpse of a new musical era highly anticipated by fans around the world.</p><p>On this occasion, the OMAR GLOBAL RADIO DAY operation is evolving slightly in its guidelines. From now on, we invite you to particularly highlight “A World Like This” in your radio requests.</p><p>However, the principle of the operation remains exactly the same: to support Omar, introduce his music to an ever-wider audience, and show international radio stations that his community is present and mobilized all around the world.</p><p>Even though the number of participants is still limited, it is extremely important to continue radio requests, messages of support, and sharing Omar's songs in different countries.</p><p>Why?</p><p>Because his new album is now fast approaching.</p><p>Radio stations play an essential role in an artist's visibility, especially with a new release and a new album on the horizon. Every request truly matters. Even a few messages can make a difference and allow new people to discover his world.</p><p>We therefore encourage all fans to continue supporting Omar on international radio stations, social media, and streaming platforms over the coming weeks.</p><p>We are also continuing to expand the operation to as many countries as possible in order to bring Omar's music to all corners of the world.</p><p>Every participation matters.<br>Every radio request matters.<br>Every share matters.</p><p>Together, let's continue supporting Omar Rudberg and help this wonderful international adventure grow.</p><h3>Store photoshoot completed</h3><p>The photoshoot for the association's official store has been successfully completed.</p><p>The new items will be arriving very soon in the store during June 2026, along with several new products prepared over the past few months. We look forward to welcoming many of you.</p><p>We can't wait to show you this collection inspired by our universe, our creativity, and our shared passion.</p><h3>English translation of the website completed</h3><p>Good news as well: the English translation of the association's website is now complete.</p><p>This important milestone will allow international fans to better discover our projects, our activities, and the world of Omar and the association.</p><p>(If you notice any untranslated sections, please do not hesitate to let us know on Instagram or by email. Thank you in advance.)</p><h3>Omar Rudberg and the Rainbow Festival in Germany</h3><p>Omar Rudberg will only take part in one announced concert this summer: on June 27, 2026, at the Rainbow Festival in Germany.</p><p>This concert is highly anticipated by fans, as it would be his first performance of the year and especially because he could perform his new song released on May 29, 2026: “A World Like This”.</p><p>Over the past several weeks, Omar has shared numerous Instagram Stories, TikToks, and posts on X to talk about his upcoming album.</p><p>He explained that he spent a great deal of time creating this project, an album composed of 12 songs written by himself, featuring personal and sincere themes that were deeply important to him.</p><p>According to his own words, this album will allow the public to get to know him better, to better understand who he really is, his emotions, his thoughts, and his personal journey. He wrote 90% of it himself.</p><p>This new musical era therefore promises to be particularly important in his career, and we are all looking forward to discovering what comes next.</p><h3>Why pre-saves are important</h3><p>Omar encouraged his fans to pre-save his new song “A WORLD LIKE THIS”.</p><p>But what exactly is a pre-save for?</p><p>A pre-save allows a song or album to be automatically added to your Spotify, Apple Music, or other streaming platform library as soon as it is officially released.</p><p>Even before a song is released, pre-saves are extremely important for artists.</p><p>They help to:</p><ul><li>measure public anticipation and interest;</li><li>improve the song's visibility on streaming platforms;</li><li>increase the chances of being featured in official playlists;</li><li>help labels, producers, and event organizers assess an artist's popularity;</li><li>and sometimes even influence future tours, events, or international promotional opportunities.</li></ul><p>The more pre-saves an artist receives before a release, the more platforms view the project as highly anticipated.</p><p>It is therefore a very simple but extremely effective way to support Omar even before the official release of his songs.</p><p>It only takes a few seconds, but it can truly have a significant impact on the visibility of his album and on future opportunities related to his career.</p><h3>What's new on the website following the release of “A World Like This”</h3><p>Following the release of Omar Rudberg's new song, “A World Like This”, several new features have been added to the association's website to allow fans to closely follow this new musical era.</p><p>You can now discover the new “Press 2026” section, which gathers the latest articles published about Omar and his new song. We regularly add new publications, interviews, reports, as well as related photos so that you can keep up with all the media coverage surrounding this new project.</p><p>The “All Omar's songs” section has also been updated with the addition of “A World Like This”. You will now be able to find this new track alongside his entire discography and follow the evolution of his musical journey.</p><p>More updates will be coming soon as new announcements are made regarding his future album and various projects.</p><p>Feel free to visit the website regularly to discover all the latest updates.</p><p>Enjoy your visit, everyone!</p><h3>Support the association to prepare future projects around Omar</h3><p>The year 2026 is shaping up to be particularly important for Omar Rudberg. With the recent release of “A World Like This” and the upcoming arrival of his new album.</p><p>Even though no tour has been officially announced to date, the arrival of a new album is often synonymous with many projects, events and, we hope, future concert dates that will allow fans to discover this new era on stage.</p><p>On our side, within O.R. World Association, we want to be ready to accompany this new adventure, and we are already beginning to think about fan projects for the concerts…</p><p>This is why we are calling on your support today.</p><p>Every membership and every donation allows us to develop the following for the community:</p><ul><li>organize contests to give away concert tickets when they become available;</li><li>offer official Omar merchandise to fans during our various operations;</li><li>fund our international projects;</li><li>develop new promotional actions to support Omar's visibility around the world;</li><li>create new creative and participatory projects to bring fans together.</li></ul><p>Our goal is simple: to allow as many fans as possible to fully enjoy this exciting new period ahead.</p><p>By becoming a member, you are not only supporting an association. You are directly participating in the realization of concrete projects designed to keep the community active and to support Omar's career in a positive, respectful and caring way.</p><p>Every contribution, no matter how small, can make a real difference.</p><p>We sincerely thank everyone who has already supported us since the beginning of this adventure.</p><p>The best may still be yet to come…</p><p>Thank you all for your trust.</p><p>The adventure continues.</p><p><b>The O.R. World Association Team</b></p>", "jo.a6.c": "The release of “A World Like This”, the evolution of the OMAR GLOBAL RADIO DAY operation, the shop ready and the English translation of the website completed.", "jo.a6.t": "May 2026: a new era begins for Omar Rudberg and our community", "jo.a6.d": "31 May 2026", "jo.a7.x": "<p>Between new music releases, festival performances, international collaborations, and the ongoing preparation of his second album, Omar Rudberg experienced an exceptionally eventful month of June.</p><h3>“A World Like This”: Omar's most personal song</h3><p>On May 29, 2026, Omar Rudberg released <i>A World Like This</i>, a song that had been eagerly awaited by his community.</p><p>Written by Omar himself, this track is undoubtedly the most intimate of his career. It tells part of his personal story: leaving Venezuela, arriving in Sweden as a child, facing the challenges of integration, language barriers, and the discrimination he experienced.</p><p>Through this song, Omar shares a heartfelt testimony that goes beyond his own journey and resonates with countless people who have lived through similar experiences.</p><p>From the moment it was released, <i>A World Like This</i> achieved excellent results across streaming platforms.</p><p>The song also marks a significant evolution in Omar's songwriting, showcasing a level of maturity, vulnerability, and artistic confidence never seen before.</p><h3>Rockbjörnen 2026: Omar receives four nominations once again</h3><p>Just a few days after the release of the single, another highly anticipated announcement arrived.</p><p>The nominations for the Rockbjörnen 2026 Awards, one of Sweden's most prestigious music awards, were officially revealed.</p><p>Although voting was limited to Sweden, many international fans managed to participate by using VPN services in order to support Omar.</p><p>On June 29, the nominations were officially announced.</p><p>Thanks to this incredible fan mobilization, Omar Rudberg received nominations in four categories:</p><ul><li>Male Artist of the Year;</li><li>Song of the Year: <i>A World Like This</i>;</li><li>Fans of the Year;</li><li>International Song of the Year: <i>Tempo</i> by Minho (written by Omar).</li></ul><p>These nominations follow the remarkable success of 2025, when Omar won every category in which he had been nominated.</p><p>The second round of voting is now open until August 28, ahead of the final ceremony scheduled for September 16 at Stockholm's Gröna Lund amusement park.</p><p>For us, this new voting campaign is particularly important.</p><p>With the release of his second studio album approaching, these awards could further strengthen Omar's visibility among the general public, the media, and music industry professionals.</p><h3>“Siren”: a collaboration that takes things to the next level</h3><p>On June 19, Omar released <i>Siren</i>, a collaboration with renowned German DJ and producer Felix Jaehn.</p><p>Known worldwide for his remix of <i>Cheerleader</i>, Felix Jaehn is now one of the most respected producers on the international electronic music scene. His songs have accumulated billions of streams worldwide, and he regularly collaborates with some of pop music's biggest artists.</p><p>This collaboration represents another important milestone in Omar's international career.</p><p>The promotional campaign surrounding the release matched the scale of the collaboration itself:</p><ul><li>inclusion in numerous Spotify playlists;</li><li>large-scale advertising campaign;</li><li>strong visibility across major streaming platforms.</li></ul><p>It was one of the biggest promotional campaigns ever seen for an Omar Rudberg release.</p><p>The official music video premiered the very same day, just a few hours after the single was released.</p><p>For several weeks beforehand, both artists had been teasing the collaboration across their social media accounts, building excitement among fans.</p><p>The first results quickly confirmed the song's potential, delivering particularly encouraging performances.</p><h3>A short escape to Portugal before returning to the studio</h3><p>Following this intense period, Omar took a few days off in Portugal.</p><p>He brought along his camera, promising fans that he would share moments from his trip.</p><p>Promise kept.</p><p>The photos offered a glimpse of a relaxed Omar enjoying a well-deserved break before returning to work.</p><p>Back in Sweden, he quickly headed back into the studio to continue recording the final tracks for his second album.</p><h3>Rehearsals before festival season</h3><p>Just before reuniting with his audience, Omar and his team dedicated two full days to rehearsing for the summer performances.</p><p>Festival season officially kicked off on June 27 at the Rainbow Festival in Cologne.</p><p>Three additional summer performances were also announced in Sweden:</p><ul><li>Malmö;</li><li>Gothenburg;</li><li>Stockholm.</li></ul><p>Further proof that this new chapter truly marks Omar's return to the stage.</p><h3>Ibiza with Nude Project</h3><p>Before launching into festival season, Omar also attended several days of events in Ibiza organized by Nude Project, the Spanish fashion brand that has become extremely popular among younger audiences.</p><p>The event brought together content creators, influencers, artists, and fashion personalities through various collaborations and activities.</p><p>This invitation once again highlights the growing interest in Omar beyond music, particularly within the worlds of fashion, lifestyle, and brand partnerships.</p><h3>A thought for Venezuela</h3><p>While staying in Ibiza, Omar learned the heartbreaking news about the earthquakes that struck Venezuela.</p><p>His mother, who had been visiting the country for several weeks, was there when the disaster occurred.</p><p>Fortunately, she is safe and is now participating in relief efforts to help the local population.</p><p>The situation deeply affected Omar, who remains strongly connected to his country of birth — a country his mother had not visited in more than thirteen years.</p><p>Our thoughts are with all the victims and their families.</p><h3>Rainbow Festival: a triumphant return</h3><p>On June 27, Omar finally returned to the stage after several months away.</p><p>Fans from many different countries traveled to Cologne to attend this long-awaited performance.</p><p>From the moment he stepped on stage, Omar appeared more radiant, confident, and energetic than ever.</p><p>The first surprise came during Felix Jaehn's set, when Omar joined him on stage to perform <i>Siren</i> live for the very first time.</p><p>A few moments later, during his own performance, he introduced another premiere by singing <i>A World Like This</i> live.</p><p>The emotion was undeniable as the audience sang every word back to him, proving that the song had already found a special place in fans' hearts.</p><p>Then came the evening's biggest surprise.</p><p>After nearly two years, Omar performed <i>Careless</i>, astonishing everyone in attendance. Until then, fans had only heard a short demo during Q&amp;A sessions on his previous tour.</p><p>The audience recognized the song immediately.</p><p>On stage, Omar officially announced that <i>Careless</i> would be released on July 3.</p><p>During a previous livestream, he had hinted that he had “a lot of surprises” coming.</p><p>That promise now seems to be becoming reality.</p><h3>The second album is getting closer</h3><p>Although no official release date has been announced yet, one thing is certain: Omar Rudberg's second studio album has entered its final stages.</p><p>Between new songs, festivals, international collaborations, and numerous announcements, everything suggests that the coming months will be decisive.</p><p>During his concert in Cologne, Omar simply told the audience:</p><blockquote><p>“See you in 2027!”</p></blockquote><p>A sentence that has already left the entire community dreaming.</p><h3>The O.R. World Association's perspective</h3><p>The past few weeks have shown once again how Omar Rudberg continues to evolve artistically without ever losing what makes him unique: his authenticity.</p><p>Every new project feels more personal, more ambitious, and more international than the last.</p><p>Our association will continue supporting this journey through its various initiatives, particularly OMAR GLOBAL RADIO DAY.</p><p>Omar Rudberg's story continues to unfold… and we are prouder than ever to be part of it.</p><h3>Together, let's build the future of the O.R. World Association</h3><p>The year 2026 marks the beginning of an exciting new chapter — not only for Omar Rudberg with the upcoming release of his second studio album, but also for our association.</p><p>Many new initiatives are already in development, including international campaigns, concert ticket giveaways, fan gifts, future fan projects at concerts, community events, and many more exciting projects that we cannot wait to share with you.</p><p>To bring these projects to life, we need your support.</p><p>By becoming a member of the O.R. World Association or making a donation, you directly contribute to the growth of our international community and help finance the initiatives we create to support Omar Rudberg's artistic journey.</p><p>Every contribution, regardless of the amount, helps us:</p><ul><li>organize contests and give away concert tickets or exclusive gifts to fans;</li><li>continue developing our website and communication tools;</li><li>prepare fan projects for concerts;</li><li>build a strong, professional, and sustainable international association.</li></ul><p>Our ambition is simple: to make the O.R. World Association a recognized international fan community capable of supporting Omar's projects while creating unforgettable experiences for fans around the world.</p><p>But this adventure can only be built together.</p><p>Every membership is a sign of support.<br>Every donation makes a new project possible.<br>Every member strengthens our mission to help Omar Rudberg shine across the globe.</p><h3>Join us today!</h3><p>Become a member of the O.R. World Association and be part of this unique adventure.</p><p>Together, let's write the next chapter of this incredible story.</p><p>Because a united community can achieve extraordinary things.</p><p><b>The O.R. World Association Team</b></p>", "jo.a7.c": "“A World Like This”, four Rockbjörnen nominations, “Siren” with Felix Jaehn, the return to the stage at the Rainbow Festival and a second album getting closer.", "jo.a7.t": "June 2026: a historic month for Omar Rudberg", "jo.a7.d": "30 June 2026", "jo.cat.omar": "OMAR", "jo.cat.actualites": "NEWS", "jo.cat.bilan": "MONTHLY REPORT", "jo.in.rgpd": "Your data is used only to send this newsletter, in accordance with the GDPR.", "jo.in.ok": "Sign me up", "jo.in.mail": "Your email address", "jo.in.p": "One message a month, with the new articles, the ongoing projects and the important dates. No advertising, unsubscribe in one click.", "jo.in.t": "Receive the newsletter", "jo
